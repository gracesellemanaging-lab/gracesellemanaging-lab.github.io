<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B0616" />
    <title>Graceselle Managing | UI/UX Designer</title>
    <meta name="description" content="Graceselle Managing UI/UX Designer crafting playful, human-centered digital experiences." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- ============ FONTS ============ -->
    <!-- Space Grotesk: display headings | Inter: body copy | Poppins: UI labels & nav -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ============ ICONS ============ -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="splash" class="loader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="splash-logo">Grace<span>s</span>elle</div>
      <div class="splash-sub">UI/UX Design Portfolio</div>
      <div
        class="splash-bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="100"
      >
        <div class="splash-bar-fill"></div>
      </div>
    </div>
    <noscript><style>.loader{display:none !important} body{overflow:auto !important; height:auto !important}</style></noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
